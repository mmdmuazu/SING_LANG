<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Speech Translator</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
    }
    h2 { font-size: 15px; margin: 0 0 12px 0; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .field { margin-bottom: 12px; }
    label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
    select, input[type="range"] {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 6px;
      border-radius: 6px;
    }
    .toggle { display: flex; justify-content: space-between; align-items: center; }
    .hint { font-size: 11px; color: #64748b; margin-top: 4px; }
    button {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #0369a1; }
    button.secondary {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
    }
    button.secondary:hover { background: #1e293b; color: white; }
  </style>
</head>
<body>
  <h2><span>🎙️</span> Live Speech Translator</h2>
  <div class="field">
    <label>Target Language</label>
    <select id="targetLang">
      <option value="en">English</option>
      <option value="es">Spanish (Español)</option>
      <option value="fr">French (Français)</option>
      <option value="de">German (Deutsch)</option>
      <option value="pt">Portuguese (Português)</option>
    </select>
    <div class="hint">Translation runs live, per phrase, as you speak.</div>
  </div>
  <div class="field">
    <label>Overlay Opacity</label>
    <input type="range" id="opacity" min="0.3" max="1" step="0.1" value="0.9">
  </div>
  <div class="field toggle">
    <label>Show Sign Language Avatar</label>
    <input type="checkbox" id="showAvatar" checked>
  </div>
  <button id="saveBtn">Save & Apply</button>
  <button id="resetBtn" class="secondary">Reset Position & Size</button>
  <script src="popup.js"></script>
</body>
</html>
